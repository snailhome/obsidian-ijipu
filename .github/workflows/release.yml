name: Release Obsidian plugin

on:
  push:
    tags: ['*']
  workflow_dispatch:    # 允许手动触发（便于本地排查/补推）

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # Vite8/rolldown 需要 Node 22+（node:util.styleText 是 Node 22 API）

      # 插件依赖 vite/esbuild/obsidian；用 install + legacy-peer-deps（比 ci 更宽容 lock 微差）
      - run: npm install --legacy-peer-deps

      - run: npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
